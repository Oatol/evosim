<style>
/* ─────────────────────────────────────────────────────────────
   evosim · 样式
   浅色界面 + 深色画布：面板克制，让模拟本身成为视觉重心。
   ───────────────────────────────────────────────────────────── */

:root {
  --bg:            #f5f6f8;
  --surface:       #ffffff;
  --surface-2:     #f0f2f5;
  --surface-3:     #e6e9ee;
  --border:        rgba(16, 20, 28, 0.10);
  --border-strong: rgba(16, 20, 28, 0.18);
  --text:          #171a1f;
  --text-2:        #59616d;
  --text-3:        #8b939f;
  --accent:        #2563eb;
  --accent-soft:   #e8effd;
  --radius:        10px;
  --radius-sm:     7px;
  --shadow:        0 1px 2px rgba(16, 20, 28, 0.06);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

button, input, select { font-family: inherit; font-size: inherit; }

/* ── 总体布局 ────────────────────────────────────────────── */

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-height: 0;
}

.stage {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;
  min-width: 0;
}

/* ── 顶栏 ────────────────────────────────────────────────── */

.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 14px;
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 5;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 7px;
  flex: 0 0 auto;
}

.brand-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.brand-sub {
  font-size: 11px;
  color: var(--text-3);
}

.topbar-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.topbar-right { margin-left: auto; }

.field {
  display: flex;
  align-items: center;
  gap: 6px;
}

.field-label {
  font-size: 11px;
  color: var(--text-3);
  white-space: nowrap;
}

.field-input {
  height: 28px;
  padding: 0 8px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  outline: none;
}

.field-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.field-number { width: 68px; }

select.field-input { cursor: pointer; }

.top-btn {
  height: 28px;
  padding: 0 11px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s;
}

.top-btn:hover { background: var(--surface-2); }
.top-btn:active { background: var(--surface-3); }

/* ── 侧栏 ────────────────────────────────────────────────── */

.sidebar {
  flex: 0 0 auto;
  width: 232px;
  padding: 12px;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--surface);
}

.sidebar-left { border-right: 1px solid var(--border); }
.sidebar-right { border-left: 1px solid var(--border); }

.sidebar::-webkit-scrollbar { width: 8px; }
.sidebar::-webkit-scrollbar-thumb {
  background: rgba(16, 20, 28, 0.14);
  border-radius: 4px;
}

.panel-title {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text-3);
  text-transform: uppercase;
}

.tool-section { margin-bottom: 18px; }

.panel-divider {
  height: 1px;
  margin: 16px 0;
  background: var(--border);
}

.tool-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tool-row-size {
  margin-top: 10px;
  align-items: center;
  flex-wrap: nowrap;
}

.tool-label {
  font-size: 11px;
  color: var(--text-3);
  flex: 0 0 auto;
}

.tool-value {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text-2);
  min-width: 14px;
  text-align: right;
  flex: 0 0 auto;
}

.tool-row-size input[type="range"] {
  flex: 1 1 auto;
  min-width: 0;
  accent-color: var(--accent);
}

.tool-btn {
  flex: 1 1 auto;
  min-width: 62px;
  height: 30px;
  padding: 0 8px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}

.tool-btn:hover { background: var(--surface-2); }

.tool-btn.is-active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}

/* ── 笔刷色块 ────────────────────────────────────────────── */

.swatch-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}

.swatch {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 7px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}

.swatch:hover { background: var(--surface-2); }

.swatch.is-active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}

.swatch-dot {
  flex: 0 0 auto;
  width: 12px;
  height: 12px;
  border-radius: 3px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.22);
}

.swatch-label {
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── 读数列表 ────────────────────────────────────────────── */

.stat-list {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 5px 10px;
  margin: 0;
}

.stat-list dt {
  font-size: 12px;
  color: var(--text-2);
}

.stat-list dd {
  margin: 0;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--text);
  text-align: right;
}

.panel-hint {
  margin: 14px 0 0;
  font-size: 11px;
  line-height: 1.6;
  color: var(--text-3);
}

/* ── 演化曲线 ────────────────────────────────────────────── */

.chart { margin-bottom: 9px; }

.chart-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 3px;
}

.chart-label {
  font-size: 11px;
  color: var(--text-2);
}

.chart-value {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  text-align: right;
}

.chart-canvas {
  display: block;
  width: 100%;
  height: 44px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}

/* ── 画布 ────────────────────────────────────────────────── */

.canvas-wrap {
  flex: 1 1 auto;
  position: relative;
  min-width: 0;
  overflow: hidden;
  background: #0b1020;
}

.canvas-wrap canvas {
  position: absolute;
  inset: 0;
  display: block;
  cursor: crosshair;
  touch-action: none;
}

.canvas-badge {
  position: absolute;
  left: 12px;
  bottom: 12px;
  padding: 4px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: rgba(255, 255, 255, 0.62);
  font-size: 11px;
  letter-spacing: 0.02em;
  pointer-events: none;
  backdrop-filter: blur(6px);
}

/* ── 时间轴 ──────────────────────────────────────────────── */

.timeline {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 22px;
  height: 52px;
  padding: 0 14px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}

.tl-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.tl-label {
  font-size: 11px;
  color: var(--text-3);
  margin-right: 2px;
}

.tl-btn {
  height: 30px;
  min-width: 54px;
  padding: 0 11px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}

.tl-btn:hover { background: var(--surface-2); }

.tl-btn-primary {
  min-width: 68px;
  font-weight: 500;
}

.tl-btn-primary.is-running {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.tl-btn-speed {
  min-width: 40px;
  padding: 0 8px;
  font-family: var(--mono);
  font-size: 12px;
}

.tl-btn-speed.is-active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}

.tl-readout { margin-left: auto; gap: 14px; }

.tl-stat {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
}

.tl-stat-dim { color: var(--text-3); }

/* ── 窄屏降级 ────────────────────────────────────────────── */

@media (max-width: 1080px) {
  .sidebar { width: 176px; }
  .brand-sub { display: none; }
}

@media (max-width: 860px) {
  .sidebar-right { display: none; }
}

/* ── 个体检视器 ──────────────────────────────────────────── */

/*
 * 非模态浮窗：不铺满视口、也不盖住工具栏——只有面板本身吃事件，
 * 其余区域 pointer-events:none，点击直接穿透到画布。
 *
 * 早期版本是全屏模态（inset:0 + 半透明遮罩），遮罩把整个视口都盖住了：
 * 跟随看不到世界、"克隆选中"点到的是遮罩而不是按钮。改成浮窗后这三个
 * 症状一起消失。
 */
.inspector {
  position: fixed;
  inset: 0;
  z-index: 40;
  pointer-events: none;
}

.inspector[hidden] { display: none; }

.inspector-panel {
  position: absolute;
  right: 18px;
  top: 64px;
  display: flex;
  flex-direction: column;
  width: min(760px, calc(100vw - 264px));
  height: min(560px, calc(100vh - 104px));
  pointer-events: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 18px 48px rgba(11, 16, 32, 0.26);
  overflow: hidden;
}

.inspector-panel.is-dragging { user-select: none; }

.inspector-head {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  cursor: grab;
}

.inspector-panel.is-dragging .inspector-head { cursor: grabbing; }

/* 图钉按钮：检视器与物种树共用同一套观感 */
.inspector-pin,
.species-tree-pin {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-3);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}

.inspector-pin:hover,
.species-tree-pin:hover { background: var(--surface-2); }

.inspector-pin svg,
.species-tree-pin svg { transition: transform 0.12s; }

.inspector-pin.is-active,
.species-tree-pin.is-active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

.inspector-pin.is-active svg,
.species-tree-pin.is-active svg { transform: rotate(45deg); }

.inspector-titles {
  flex: 1 1 auto;
  min-width: 0;
}

.inspector-title {
  font-size: 13px;
  font-weight: 600;
}

.inspector-subtitle {
  margin-top: 2px;
  font-size: 11px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.inspector-close {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-2);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  transition: background 0.12s;
}

.inspector-close:hover { background: var(--surface-2); }

.inspector-body {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;
}

.inspector-col {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 12px 14px;
}

.inspector-col-left {
  flex: 0 0 auto;
  width: 264px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
}

.inspector-col-right {
  flex: 1 1 auto;
  min-width: 0;
}

.inspector-section-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text-3);
  text-transform: uppercase;
}

.inspector-dim {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text-3);
}

.inspector-body-canvas {
  display: block;
  width: 100%;
  height: 196px;
  margin-bottom: 14px;
  border-radius: var(--radius-sm);
  background: #0b1020;
}

.inspector-attrs { margin-bottom: 4px; }
.inspector-attrs dt { font-size: 11px; }
.inspector-attrs dd { font-size: 11px; }

.inspector-net-canvas {
  display: block;
  width: 100%;
  flex: 1 1 auto;
  min-height: 240px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}

.inspector-legend {
  flex: 0 0 auto;
  margin-top: 8px;
  font-size: 10px;
  line-height: 1.6;
  color: var(--text-3);
}

/* ── 参数抽屉 ────────────────────────────────────────────── */

/*
 * 参数面板是 .stage 里的一个 flex 子项，不是浮层：
 * 展开时画布变窄而不是被盖住——被盖住的画布会让人误以为某块区域没在演化。
 * 画布变窄会触发 ResizeObserver，渲染器自己会跟着重算。
 */
.param-host {
  flex: 0 0 auto;
  min-width: 0;
  display: flex;
}

.param-drawer {
  display: flex;
  flex-direction: column;
  width: 316px;
  border-right: 1px solid var(--border);
  background: var(--surface);
}

.param-drawer[hidden] { display: none; }

.param-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--border);
}

.param-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.param-sub {
  margin-top: 2px;
  font-size: 11px;
  color: var(--text-3);
}

.param-close {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-2);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
}

.param-close:hover { background: var(--surface-2); }

.param-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 8px 12px 20px;
}

.param-body::-webkit-scrollbar { width: 8px; }
.param-body::-webkit-scrollbar-thumb {
  background: rgba(16, 20, 28, 0.14);
  border-radius: 4px;
}

.param-group {
  border-bottom: 1px solid var(--border);
}

.param-group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 2px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  list-style: none;
}

.param-group-head::-webkit-details-marker { display: none; }

.param-group-head::before {
  content: '▸';
  margin-right: 6px;
  font-size: 10px;
  color: var(--text-3);
  transition: transform 0.15s;
}

.param-group[open] > .param-group-head::before {
  content: '▾';
}

.param-group-head > span:first-child { flex: 1 1 auto; }

.param-reset {
  flex: 0 0 auto;
  padding: 2px 7px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--surface);
  color: var(--text-3);
  font-size: 10px;
  font-weight: 400;
  cursor: pointer;
}

.param-reset:hover {
  border-color: var(--border-strong);
  color: var(--text-2);
}

.param-rows {
  padding: 2px 0 12px;
}

.param-row {
  padding: 6px 2px 7px;
}

.param-row-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}

.param-label {
  font-size: 12px;
  color: var(--text-2);
}

.param-value {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
}

.param-slider {
  display: block;
  width: 100%;
  height: 18px;
  margin: 0;
  accent-color: var(--accent);
}

.param-row-bool {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.param-row-bool .param-row-head {
  flex: 1 1 auto;
  margin-bottom: 0;
}

.param-switch {
  position: relative;
  flex: 0 0 auto;
  width: 38px;
  height: 20px;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  background: var(--surface-2);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.param-switch::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow);
  transition: transform 0.15s;
}

.param-switch.is-on {
  background: var(--accent);
  border-color: var(--accent);
}

.param-switch.is-on::after { transform: translateX(18px); }

.param-apply {
  margin-top: 6px;
  width: 100%;
  height: 26px;
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11px;
  cursor: pointer;
}

.param-apply:hover { background: #dbe7fc; }

.param-row-readonly .param-value { color: var(--text-3); }

.param-note {
  margin-top: 3px;
  font-size: 10px;
  line-height: 1.5;
  color: var(--text-3);
}

/* ── 工具栏补充 ──────────────────────────────────────────── */

.tool-row[hidden] { display: none; }

.swatch.is-empty {
  opacity: 0.5;
  border-style: dashed;
}

          placed = spawnFromBlueprint(world, c0 + dx, r0 + dy, blueprint);
        }
      }
    }
    if (placed) {
      refreshAll();
      toast(`已投放${name ? '：' + name : ''}（${placed.anatomy.describe()}）`);
    } else {
      toast('视野中心附近没有空位，先把画布移到空旷处再投放', true);
    }
  };

  /**
   * 手动放置：把蓝图装进放置笔刷，并**收起工坊**让出画布——
   * 下一步就是点画布，面板挡着会很难受（和"克隆选中"是同一条道理）。
   */
  speciesEditor.onPlace = (blueprint, name) => {
    editor.setCloneBlueprint(blueprint);
    toolbar.refreshBrush();
    speciesEditor.close();
    toast(`已装入「${name || blueprint.label}」　在画布上点哪里就放在哪里（Esc 取消）`);
  };

  /** 放置结果反馈：一次点击/拖动结束后汇报成功与失败 */
  editor.onPlaceFeedback = (placed, missed) => {
    if (placed > 0) {
      refreshAll();
      toast(`已放置 ${placed} 个个体${missed > 0 ? `（${missed} 处被占，跳过）` : ''}`);
    } else if (missed > 0) {
      toast('这里放不下——换个空一点的位置', true);
    }
  };

  // 检视器里的"保存生物"：连大脑一起存进生物库
  inspector.onSaveCreature = (org) => {
    const sp = world.species.byFingerprint(org.speciesFingerprint);
    const entry = library.add(makeBlueprint(org), sp ? sp.name : '');
    if (!entry) { toast('保存失败：这个个体没有身体', true); return; }
    speciesEditor.refreshLibrary();
    toast(`已存进生物库：${entry.name}（${org.anatomy.describe()}）`);
  };

  // ── 导出 ──
  // 桌面版（evosim.exe）会写进程序所在目录；浏览器版退回下载。
  toolbar.onExportFossil = async () => {
    const csv = fossilToCSV(record);
    const result = await saveText(csv, exportFilename('history', world.tick));
    toast(`${record.count} 个采样点 · ${describeSaveTarget(result)}`);
  };
  toolbar.onExportSpecies = async () => {
    const csv = speciesToCSV(world.species);
    const result = await saveText(csv, exportFilename('species', world.tick));
    toast(`${world.species.list.length} 条物种记录 · ${describeSaveTarget(result)}`);
  };

  // 克隆笔刷：把检视中的个体装进去，之后可以随手投放
  toolbar.onCloneSelected = () => {
    const org = inspector.organism;
    if (!org) {
      toast('先用「检视」工具点一个个体，再克隆它');
      return;
    }
    editor.setCloneBlueprint(makeBlueprint(org));
    toolbar.refreshBrush();
    // 检视器现在是浮窗、不再遮住画布，所以不用再关它——锁上还能边看边投放
    toast(`已装入蓝图：${org.anatomy.describe()}　点击画布即可投放`);
  };

  // ── 顶栏：配色方案 ──
  const schemeSelect = document.getElementById('scheme-select');
  for (const [key, scheme] of Object.entries(COLOR_SCHEMES)) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = scheme.label;
    schemeSelect.appendChild(opt);
  }
  schemeSelect.value = colorScheme.name;
  schemeSelect.addEventListener('change', () => {
    colorScheme.setScheme(schemeSelect.value);
    renderer.refreshPalette();
    toolbar.refreshColors();
  });

  // ── 顶栏：着色模式（按类型 / 按物种）──
  const colorModeSelect = document.getElementById('color-mode');
  colorModeSelect.value = renderer.colorMode;
  colorModeSelect.addEventListener('change', () => {
    renderer.setColorMode(colorModeSelect.value);
  });

  // ── 顶栏：物种树 ──
  const speciesTreeBtn = document.getElementById('btn-species-tree');
  speciesTreeBtn.addEventListener('click', () => {
    speciesTree.toggle();
    speciesTreeBtn.classList.toggle('is-active', speciesTree.isOpen);
  });
  speciesTree.onOpenChanged = (open) => speciesTreeBtn.classList.toggle('is-active', open);

  // ── 顶栏：物种工坊 ──
  const speciesEditorBtn = document.getElementById('btn-species-editor');
  speciesEditorBtn.addEventListener('click', () => speciesEditor.toggle());
  speciesEditor.onOpenChanged = (open) => speciesEditorBtn.classList.toggle('is-active', open);

  // ── 顶栏：世界尺寸 ──
  const colsInput = document.getElementById('world-cols');
  const rowsInput = document.getElementById('world-rows');
  colsInput.value = String(world.grid.cols);
  rowsInput.value = String(world.grid.rows);

  const applyResize = () => {
    const cols = clampInt(colsInput.value, 40, 800, world.grid.cols);
    const rows = clampInt(rowsInput.value, 30, 600, world.grid.rows);
    colsInput.value = String(cols);
    rowsInput.value = String(rows);
    if (cols === world.grid.cols && rows === world.grid.rows) return;

    // 重建世界期间先停下，避免在半截状态里跑 tick；重建完再恢复原来的运行状态
    const wasRunning = engine.running;
    engine.pause();
    world.resize(cols, rows);
    renderer.notifyWorldResized();
    camera.fitGrid(cols, rows, renderer.width, renderer.height, 20);
    regenerateWorld();
    resetHistory();
    controlPanel.syncAll();
    refreshAll();
    if (wasRunning) engine.start();
    toast(`世界已重建为 ${cols} × ${rows}`);
  };
  document.getElementById('btn-apply-size').addEventListener('click', applyResize);
  colsInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyResize(); });
  rowsInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyResize(); });

  // ── 顶栏：世界操作 ──
  document.getElementById('btn-regenerate').addEventListener('click', () => {
    const wasRunning = engine.running;
    engine.pause();
    world.rng.seed(Date.now() & 0x7fffffff);
    regenerateWorld();
    resetHistory();
    refreshAll();
    if (wasRunning) engine.start();
  });

  // 清空是例外：清完世界是空的，停下来等用户画东西比空转更合理
  document.getElementById('btn-clear').addEventListener('click', () => {
    engine.pause();
    world.reset(false);
    resetHistory();
    refreshAll();
    timeline.refresh();
  });

  document.getElementById('btn-fit').addEventListener('click', () => toolbar.fitToWindow());

  // ── 顶栏：参数抽屉 ──
  const paramsBtn = document.getElementById('btn-params');
  paramsBtn.addEventListener('click', () => {
    controlPanel.toggle();
    paramsBtn.classList.toggle('is-active', controlPanel.isOpen);
  });

  controlPanel.onToggle = (open) => {
    paramsBtn.classList.toggle('is-active', open);
  };

  // 参数改动的副作用。绝大多数参数是"每 tick 现读"的，改了就生效；
  // 只有少数需要在改的瞬间做点事，全部收在这一个 switch 里。
  controlPanel.onChange = (section, key, value) => {
    if (section === 'world' && key === 'wrapEdges') {
      world.grid.wrap = value;
      renderer.requestFullRedraw();
    } else if (section === 'stats' && key === 'recordSize') {
      record.allocate(value);
      charts.markDirty();
    } else if (section === 'sim' && key === 'baseTicksPerSecond') {
      engine.setBaseTps(value);
    } else if (section === 'sim' && key === 'maxStepsPerFrame') {
      engine.maxStepsPerFrame = value;
    }
    renderer.needsRender = true;
  };

  // 网格尺寸是延迟生效的：滑块只把待应用值送过来，世界不会立刻被清空
  controlPanel.onDeferredChange = (section, key, value) => {
    if (section !== 'world') return;
    if (key === 'cols') colsInput.value = String(value);
    else if (key === 'rows') rowsInput.value = String(value);
  };

  controlPanel.onResizeRequest = () => applyResize();

  /** 读档会整体替换 Config，有些参数需要重新落到运行时对象上 */
  function applyConfigSideEffects() {
    world.grid.wrap = Config.world.wrapEdges;
    if (record.size !== Config.stats.recordSize) record.allocate(Config.stats.recordSize);
    engine.setBaseTps(Config.sim.baseTicksPerSecond);
    engine.maxStepsPerFrame = Config.sim.maxStepsPerFrame;
  }

  // ── 顶栏：存档 ──
  const fileInput = document.getElementById('save-file');

  const doSave = async () => {
    const data = serializeWorld(world, rng, { config: JSON.parse(JSON.stringify(Config)) });
    const result = await saveText(JSON.stringify(data), saveFilename(world),
      { mime: 'application/json', bom: false });
    toast(`${data.organisms.length} 个个体 · ${world.species.list.length} 条物种记录 · `
      + describeSaveTarget(result));
  };

  const doLoad = (data, source) => {
    const wasRunning = engine.running;
    engine.pause();
    try {
      const info = deserializeWorld(world, rng, data);
      applyConfigSideEffects();
      renderer.notifyWorldResized();
      camera.fitGrid(world.grid.cols, world.grid.rows, renderer.width, renderer.height, 20);
      resetHistory();
      controlPanel.syncAll();
      // 读档可能带来不同的世界尺寸，顶栏那两个输入框要跟着走
      colsInput.value = String(world.grid.cols);
      rowsInput.value = String(world.grid.rows);
      refreshAll();
      timeline.refresh();
      if (wasRunning) engine.start();
      const warn = info.brainSkipped > 0 ? ` · ${info.brainSkipped} 个大脑拓扑不符已重置` : '';
      toast(`${source}：tick ${world.tick} · ${info.organisms} 个个体 · ${info.species} 个物种${warn}`);
    } catch (err) {
      engine.start();
      toast(`读档失败：${err.message}`, true);
    }
  };

  document.getElementById('btn-save').addEventListener('click', doSave);

  document.getElementById('btn-load').addEventListener('click', () => {
    const quick = storageInfo();
    // 有快存就先问一句：直接弹文件选择框会让人以为快存不存在
    if (quick) {
      const when = quick.savedAt ? new Date(quick.savedAt).toLocaleString() : '未知时间';
      if (confirm(`检测到快速存档（${when}，tick ${quick.tick}）。\n\n确定 = 读取快速存档\n取消 = 从文件读取`)) {
        try {
          doLoad(loadFromStorage(), '快速读档');
        } catch (err) {
          toast(`快速读档失败：${err.message}`, true);
        }
        return;
      }
    }
    fileInput.click();
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';              // 允许连续读同一个文件
    if (!file) return;
    try {
      doLoad(await readSaveFile(file), `已读取 ${file.name}`);
    } catch (err) {
      toast(`读档失败：${err.message}`, true);
    }
  });

  // ── 引擎回调 ──
  engine.onFrame = () => {
    // 相机跟随：把被跟随个体的当前位置喂给相机
    if (inspector.following) {
      const o = inspector.organism;
      if (!o || !o.alive) {
        inspector.setFollow(false);
      } else {
        camera.follow = { col: o.col, row: o.row };
        if (camera.updateFollow(renderer.width, renderer.height)) renderer.needsRender = true;
      }
    }
    if (renderer.needsRender) renderer.render();
  };

  // ── 化石记录采样 ──
  engine.onTick = () => {
    const interval = Config.stats.interval;
    if (interval > 0 && world.tick % interval === 0) sampleWorld();
    if (Config.world.autoReset && world.organisms.length === 0) autoReset();
  };

  let autoResetPending = false;
  function autoReset() {
    if (autoResetPending) return;
    autoResetPending = true;
    // 延迟到下一帧再重建：此刻还在 engine 的 tick 循环里，直接重建会让
    // 循环里的 organisms 数组引用变成悬空的旧数组
    setTimeout(() => {
      autoResetPending = false;
      world.rng.seed(Date.now() & 0x7fffffff);
      regenerateWorld();
      resetHistory();
      refreshAll();
      toast('种群灭绝，已自动重置世界');
    }, 0);
  }

  function sampleWorld() {
    const tick = world.tick;
    world.species.update(world, tick);
    world.species.prune();

    const bio = world.detailedStats();
    record.push({
      tick,
      population: world.organisms.length,
      species: world.species.aliveCount,
      avgCells: bio.avgCells,
      avgMutability: bio.avgMutability,
      cellShares: bio.cellShares,
    });
  }

  /** 世界重建后清空历史，并立刻采一个起点样本，曲线才不会从空白开始 */
  function resetHistory() {
    record.reset();
    charts.markDirty();
    inspector.close();              // 被检视的个体已经不存在了
    speciesTree.close();            // 物种表也重建了，旧树没有意义
    sampleWorld();
  }

  let readoutTimer = 0;
  engine.onAfterFrame = () => {
    readoutTimer += 1;
    // 用帧数节流而不是时间，保证暂停时读数依然会刷新一次
    if (readoutTimer >= 8) {
      readoutTimer = 0;
      refreshReadouts();
    }
  };

  function refreshReadouts() {
    timeline.refresh();
    timeline.refreshRates();
    stats.refresh();
    charts.refresh();     // 内部会跳过没有新样本的曲线
    if (inspector.isOpen) inspector.refresh();
    if (speciesTree.isOpen) speciesTree.refresh();
  }

  function refreshAll() {
    renderer.render();
    refreshReadouts();
  }

  // ── 提示条 ──
  let toastTimer = 0;
  function toast(message, isError = false) {
    toastEl.textContent = message;
    toastEl.classList.toggle('is-error', isError);
    toastEl.hidden = false;
    // 下一帧再加 is-visible，否则 hidden 刚去掉时 transition 不会触发
    requestAnimationFrame(() => toastEl.classList.add('is-visible'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('is-visible');
      setTimeout(() => { toastEl.hidden = true; }, 220);
    }, isError ? 5200 : 2600);
  }

  // ── 画布尺寸跟随 ──
  const resizeObserver = new ResizeObserver(() => {
    renderer.resize();
    renderer.render();
  });
  resizeObserver.observe(canvas.parentElement);

  window.addEventListener('resize', () => {
    charts.onResize();
    speciesTree.onResize();
  });

  // ── 快捷键 ──
  window.addEventListener('keydown', (event) => {
    const tag = event.target && event.target.tagName;
    const typing = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';

    // Ctrl+S 存盘：比浏览器自带的"保存网页"更符合这个场景
    if ((event.ctrlKey || event.metaKey) && (event.key === 's' || event.key === 'S')) {
      event.preventDefault();
      doSave();
      return;
    }

    if (typing) return;

    if (event.key === 'Escape') {
      if (inspector.isOpen) inspector.close();
      else if (speciesEditor.isOpen) speciesEditor.close();
      else if (speciesTree.isOpen) speciesTree.close();
      else if (controlPanel.isOpen) controlPanel.close();
      // 都关完了还按 Esc，就退出"放置模式"——装好蓝图后它是唯一还挂着的状态
      else if (editor.isPlacing) {
        editor.cancelClone();
        toast('已取消放置');
      }
      return;
    }

    if (event.code === 'Space') {
      event.preventDefault();
      engine.toggle();
      timeline.refresh();
    } else if (event.key === 's' || event.key === 'S') {
      engine.pause();
      engine.stepOnce();
      timeline.refresh();
    } else if (event.key === 'r' || event.key === 'R') {
      const wasRunning = engine.running;
      engine.pause();
      world.reset(Config.world.clearWallsOnReset);
      resetHistory();
      refreshAll();
      timeline.refresh();
      if (wasRunning) engine.start();
    } else if (event.key === 'f' || event.key === 'F') {
      toolbar.fitToWindow();
    } else if (event.key === 'p' || event.key === 'P') {
      controlPanel.toggle();
    } else if (event.key === 't' || event.key === 'T') {
      speciesTree.toggle();
    } else if (event.key === 'g' || event.key === 'G') {
      speciesEditor.toggle();
    } else if (event.key === 'i' || event.key === 'I') {
      editor.setTool(editor.tool === 'inspect' ? 'paint' : 'inspect');
      toolbar.refreshBrush();
    }
  });

  // ── 起飞 ──
  resetHistory();
  refreshAll();
  engine.start();

  // 方便在控制台里调试
  window.evosim = {
    Config, world, camera, renderer, editor, engine, colorScheme, rng,
    record, charts, stats, inspector, toolbar, controlPanel, timeline, speciesTree,
    library, speciesEditor,
    save: () => serializeWorld(world, rng, { config: JSON.parse(JSON.stringify(Config)) }),
    load: (data) => deserializeWorld(world, rng, data),
    quickSave: () => saveToStorage(serializeWorld(world, rng, { config: JSON.parse(JSON.stringify(Config)) })),
    quickLoad: () => doLoad(loadFromStorage(), '快速读档'),
    quickInfo: () => storageInfo(),
    quickClear: () => clearStorage(),
    storageAvailable,
    exportFossil: () => toolbar.onExportFossil(),
    exportSpecies: () => toolbar.onExportSpecies(),
    saveText,
    hostSaveDir,
    toast,
  };
}

function clampInt(raw, min, max, fallback) {
  const n = parseInt(raw, 10);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, n));
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

  return {  };
});

  __req("src/main.js");
})();
</script>
</body>
